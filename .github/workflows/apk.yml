name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Preparar arquivos do jogo
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js personagens.json icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - name: Forçar tela deitada
        run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: saiyan-world-remake-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
